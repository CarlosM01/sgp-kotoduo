# SGP-Kotoduo — full stack: PostgreSQL, MongoDB, API and web (nginx).
#   Full stack:          docker compose up -d --build   → http://localhost:8080
#   Databases only (dev): docker compose up -d postgres mongo
#   Reset data:          docker compose down -v
# Ports bind to 127.0.0.1 only. The API is not published: it is reached through
# the web container (nginx forwards /api), which is also the only trusted proxy.

services:
  postgres:
    image: postgres:16-alpine
    container_name: sgp-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sgp_kotoduo}
      POSTGRES_USER: ${POSTGRES_USER:-sgp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Init scripts run only on first start (empty volume), in name order.
      - ./db/postgres/01_ddl.sql:/docker-entrypoint-initdb.d/01_ddl.sql:ro
      - ./db/postgres/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      # Manual scripts (volume, integrity checks): psql -f /sgp/<file>.sql
      - ./db/postgres:/sgp:ro
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: ${MONGO_IMAGE:-mongo:9.0}
    container_name: sgp-mongo
    environment:
      MONGO_INITDB_DATABASE: sgp_docs
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - ./db/mongo/mongo-init.sh:/docker-entrypoint-initdb.d/10_mongo_init.sh:ro
      - ./db/mongo:/bd:ro
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: sgp-kotoduo-api
    container_name: sgp-api
    environment:
      # Production mode: the API refuses to start with the .env.example JWT_SECRET.
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-sgp}:${POSTGRES_PASSWORD:-change_me_local}@postgres:5432/${POSTGRES_DB:-sgp_kotoduo}
      MONGO_URL: mongodb://mongo:27017/sgp_docs
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env, for example with openssl rand -base64 48}"
      API_PORT: 3000
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8080}
      # One proxy hop (the web container): client IP for rate limits and the audit log.
      TRUST_PROXY: 1
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: sgp-kotoduo-web
    container_name: sgp-web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  mongo_data:
