# SGP-Kotoduo — local stack. Usage: docker compose up -d · reset: docker compose down -v
# Ports bind to 127.0.0.1 only. The api and web services are added in F6.

services:
  postgres:
    image: postgres:16-alpine
    container_name: sgp-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sgp_kotoduo}
      POSTGRES_USER: ${POSTGRES_USER:-sgp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Init scripts run only on first start (empty volume), in name order.
      - ./db/postgres/01_ddl.sql:/docker-entrypoint-initdb.d/01_ddl.sql:ro
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: ${MONGO_IMAGE:-mongo:9.0}
    container_name: sgp-mongo
    environment:
      MONGO_INITDB_DATABASE: sgp_docs
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - ./db/mongo/mongo-init.sh:/docker-entrypoint-initdb.d/10_mongo_init.sh:ro
      - ./db/mongo:/bd:ro
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
  mongo_data:
