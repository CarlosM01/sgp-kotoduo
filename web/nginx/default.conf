# Serves the built client and forwards /api to the API container, so the
# browser only talks to one origin (same as the Vite dev proxy, D27).
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Slightly above the API limit (100 kB) so the API answers 413 in its own JSON format.
    client_max_body_size 200k;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append: the client cannot inject an address the API
        # trusts (TRUST_PROXY=1). The API sets its own security headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build files never change under the same name.
    location /assets/ {
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        # Without "always": a 404 for a missing asset must not be cached for a year.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/ordenes/12, /mi-trabajo...) fall back to index.html.
    location / {
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
